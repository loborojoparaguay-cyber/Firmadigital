<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Firma de Factura</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
    .card { max-width: 560px; margin: 0 auto; background: #1e293b; padding: 18px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; font-size: 1.2rem; color: #38bdf8; }
    label { display: block; margin-top: 14px; font-size: 0.9rem; color: #cbd5e1; font-weight: 500; }
    input[type="text"], input[type="file"] {
      width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem;
    }
    .tabs { display: flex; gap: 8px; margin-top: 8px; }
    .tab-btn {
      flex: 1; padding: 9px; border: 1px solid #334155; border-radius: 8px;
      background: #0f172a; color: #94a3b8; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .canvas-wrap {
      margin-top: 8px; background: #ffffff; border-radius: 8px; border: 2px dashed #64748b;
      position: relative; overflow: hidden;
    }
    canvas.pad { width: 100%; height: 190px; display: block; touch-action: none; cursor: crosshair; }
    canvas.pad-small { height: 110px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button.action {
      flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 600;
      font-size: 0.92rem; cursor: pointer;
    }
    .btn-clear { background: #475569; color: #fff; }
    .btn-recover { background: #d97706; color: #fff; display: none; }
    .btn-primary { background: #0284c7; color: #fff; margin-top: 16px; width: 100%; }
    .btn-confirm { background: #16a34a; color: #fff; width: 100%; margin-top: 12px; }
    .status { font-size: 0.8rem; color: #4ade80; margin-top: 5px; min-height: 16px; }
    #previewBox { display: none; margin-top: 18px; padding: 14px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    #pdfPreviewCanvas { width: 100%; height: auto; border-radius: 6px; margin-top: 10px; border: 1px solid #475569; background: #fff; }
  </style>
</head>
<body>

<div class="card">
  <h2>Firma de Factura / Remisión</h2>

  <label>1. Cargar PDF:</label>
  <input type="file" id="pdfInput" accept="application/pdf">

  <label>2. Firma del cliente (dedo o lápiz táctil):</label>
  <div class="canvas-wrap">
    <canvas id="sigCanvas" class="pad"></canvas>
  </div>
  <div class="status" id="autoSaveStatus"></div>
  <div class="row">
    <button type="button" class="action btn-clear" id="btnClearSig">Limpiar firma</button>
    <button type="button" class="action btn-recover" id="btnRecover">Recuperar borrador</button>
  </div>

  <label>3. Aclaración (Nombre / C.I.):</label>
  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabTexto">⌨️ Escribir con teclado</button>
    <button type="button" class="tab-btn" id="tabMano">✍️ Escribir a mano</button>
  </div>

  <div id="aclaracionTextoBox">
    <input type="text" id="nombreInput" placeholder="Ej: Juan Pérez - CI 4.123.456">
  </div>

  <div id="aclaracionManoBox" style="display:none;">
    <div class="canvas-wrap">
      <canvas id="aclaracionCanvas" class="pad pad-small"></canvas>
    </div>
    <div class="row">
      <button type="button" class="action btn-clear" id="btnClearAcl">Limpiar aclaración</button>
    </div>
  </div>

  <button type="button" class="action btn-primary" id="btnPreview">Generar vista previa del PDF firmado</button>

  <div id="previewBox">
    <strong style="color:#38bdf8;" id="previewTitle">Así queda tu PDF listo para imprimir:</strong>
    <canvas id="pdfPreviewCanvas"></canvas>
    <button type="button" class="action btn-confirm" id="btnDownload">Confirmar y Descargar PDF</button>
  </div>
</div>

<script>
  const sigCanvas = document.getElementById('sigCanvas');
  const aclCanvas = document.getElementById('aclaracionCanvas');
  const statusEl = document.getElementById('autoSaveStatus');
  const btnRecover = document.getElementById('btnRecover');
  const previewBox = document.getElementById('previewBox');
  const previewTitle = document.getElementById('previewTitle');

  let pdfBytes = null;
  let signedPdfBytesCache = null;
  let pdfFileName = 'factura_firmada.pdf';
  let modoAclaracion = 'texto';

  const sigPad = new SignaturePad(sigCanvas, {
    penColor: '#000080',
    minWidth: 1.5,
    maxWidth: 3
  });

  const aclPad = new SignaturePad(aclCanvas, {
    penColor: '#000080',
    minWidth: 1.3,
    maxWidth: 2.5
  });

  function resizePad(canvasEl, pad) {
    if (canvasEl.offsetWidth === 0 || canvasEl.offsetHeight === 0) return;
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const data = pad.toData();
    canvasEl.width = canvasEl.offsetWidth * ratio;
    canvasEl.height = canvasEl.offsetHeight * ratio;
    canvasEl.getContext('2d').scale(ratio, ratio);
    pad.clear();
    if (data && data.length) pad.fromData(data);
  }

  window.addEventListener('resize', () => {
    resizePad(sigCanvas, sigPad);
    if (modoAclaracion === 'mano') resizePad(aclCanvas, aclPad);
  });

  resizePad(sigCanvas, sigPad);
  window.addEventListener('load', () => resizePad(sigCanvas, sigPad));

  sigPad.addEventListener('endStroke', () => {
    if (!sigPad.isEmpty()) {
      localStorage.setItem('firma_borrador_v3', sigPad.toDataURL('image/png'));
      statusEl.textContent = '✓ Borrador guardado automáticamente';
      btnRecover.style.display = 'none';
    }
  });
  if (localStorage.getItem('firma_borrador_v3')) btnRecover.style.display = 'block';

  document.getElementById('btnClearSig').addEventListener('click', () => {
    sigPad.clear();
    previewBox.style.display = 'none';
    statusEl.textContent = 'Firma borrada. Podés recuperarla si fue por error.';
    if (localStorage.getItem('firma_borrador_v3')) btnRecover.style.display = 'block';
  });

  btnRecover.addEventListener('click', () => {
    const saved = localStorage.getItem('firma_borrador_v3');
    if (saved) {
      sigPad.fromDataURL(saved);
      statusEl.textContent = '✓ Borrador recuperado';
      btnRecover.style.display = 'none';
    }
  });

  document.getElementById('btnClearAcl').addEventListener('click', () => aclPad.clear());

  const tabTexto = document.getElementById('tabTexto');
  const tabMano = document.getElementById('tabMano');
  const boxTexto = document.getElementById('aclaracionTextoBox');
  const boxMano = document.getElementById('aclaracionManoBox');

  tabTexto.addEventListener('click', () => {
    modoAclaracion = 'texto';
    tabTexto.classList.add('active');
    tabMano.classList.remove('active');
    boxTexto.style.display = 'block';
    boxMano.style.display = 'none';
  });

  tabMano.addEventListener('click', () => {
    modoAclaracion = 'mano';
    tabMano.classList.add('active');
    tabTexto.classList.remove('active');
    boxTexto.style.display = 'none';
    boxMano.style.display = 'block';
    setTimeout(() => resizePad(aclCanvas, aclPad), 50);
  });

  document.getElementById('pdfInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pdfFileName = file.name.replace(/\.pdf$/i, '') + '_FIRMADO.pdf';
    pdfBytes = await file.arrayBuffer();
    previewBox.style.display = 'none';
  });

  function getFechaHoy() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
  }

  document.getElementById('btnPreview').addEventListener('click', async () => {
    if (!pdfBytes) return alert('Primero cargá un archivo PDF.');
    if (sigPad.isEmpty()) return alert('Falta la firma del cliente.');

    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.load(pdfBytes);
    const pages = pdfDoc.getPages();
    const lastPage = pages[pages.length - 1];
    const { width } = lastPage.getSize();

    const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

    // Sello fijo abajo a la derecha
    const boxW = 200;
    const boxH = 78;
    const boxX = width - boxW - 50;
    const boxY = 230;

    // Solo borde (sin fondo blanco, no tapa ninguna línea del documento)
    lastPage.drawRectangle({
      x: boxX, y: boxY, width: boxW, height: boxH,
      borderColor: rgb(0.1, 0.1, 0.1),
      borderWidth: 1.1
    });

    const titulo = 'RECIBI CONFORME';
    const tituloW = fontBold.widthOfTextAtSize(titulo, 11);
    lastPage.drawText(titulo, {
      x: boxX + (boxW - tituloW) / 2, y: boxY + boxH - 16,
      size: 11, font: fontBold, color: rgb(0.1, 0.1, 0.1)
    });

    const cTexto = rgb(0.1, 0.1, 0.1);
    const cTinta = rgb(0, 0, 0.45);
    lastPage.drawText('Firma:........................................................', { x: boxX + 8, y: boxY + 42, size: 8.5, font: fontRegular, color: cTexto });
    lastPage.drawText('Aclaración:.................................................', { x: boxX + 8, y: boxY + 24, size: 8.5, font: fontRegular, color: cTexto });
    lastPage.drawText('Fecha:........................................................', { x: boxX + 8, y: boxY + 8, size: 8.5, font: fontRegular, color: cTexto });

    const sigImage = await pdfDoc.embedPng(sigPad.toDataURL('image/png'));
    lastPage.drawImage(sigImage, { x: boxX + 42, y: boxY + 36, width: 115, height: 28 });

    if (modoAclaracion === 'mano' && !aclPad.isEmpty()) {
      const aclImage = await pdfDoc.embedPng(aclPad.toDataURL('image/png'));
      lastPage.drawImage(aclImage, { x: boxX + 54, y: boxY + 20, width: 132, height: 22 });
    } else {
      const nombre = document.getElementById('nombreInput').value.trim();
      if (nombre) {
        lastPage.drawText(nombre.substring(0, 32), { x: boxX + 56, y: boxY + 26, size: 8.5, font: fontBold, color: cTinta });
      }
    }

    lastPage.drawText(getFechaHoy(), { x: boxX + 40, y: boxY + 10, size: 8.5, font: fontBold, color: cTinta });

    signedPdfBytesCache = await pdfDoc.save();
    previewBox.style.display = 'block';

    const previewCanvas = document.getElementById('pdfPreviewCanvas');
    if (typeof pdfjsLib !== 'undefined') {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const loadingTask = pdfjsLib.getDocument({ data: signedPdfBytesCache.slice(0) });
        const pdfRendered = await loadingTask.promise;
        const page = await pdfRendered.getPage(pdfRendered.numPages);
        const viewport = page.getViewport({ scale: 1.4 });
        const ctx = previewCanvas.getContext('2d');
        previewCanvas.width = viewport.width;
        previewCanvas.height = viewport.height;
        previewCanvas.style.display = 'block';
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        previewTitle.textContent = 'Así queda tu PDF listo para imprimir:';
      } catch (err) {
        previewCanvas.style.display = 'none';
        previewTitle.textContent = 'PDF generado correctamente (tocá el botón verde para descargar y verlo):';
      }
    } else {
      previewCanvas.style.display = 'none';
      previewTitle.textContent = 'PDF generado correctamente (tocá el botón verde para descargar y verlo):';
    }

    previewBox.scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('btnDownload').addEventListener('click', () => {
    if (!signedPdfBytesCache) return;
    const blob = new Blob([signedPdfBytesCache], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = pdfFileName;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
